<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Enviar Mensagem - Criptograte</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <container id="envio">
        <h1>ENVIAR MENSAGEM</h1>

        <p id="usuario"></p>

        <label for="destinatario">DESTINARÁRIO:</label>

        <select id="destinatario">
            <option value="">SELECIONE O DESTINATÁRIO</option>
        </select>

        <br><br>

        <label for="assunto">ASSUNTO:</label>
   

    
        <input
            type="text"
            id="assunto"
            placeholder="DIGITE O ASSUNTO"
        >
    
        <br><br>
    </container>

    <container id="mensagem-container">
        <label for="mensagem">MENSAGEM:</label>

        <br>

        <textarea
            id="mensagem"
            rows="8"
            cols="50"
            minlength="10"
            required
            placeholder="DIGITE A MENSAGEM"
        ></textarea>

        <section id="arvore-visualizacao" aria-live="polite" hidden>
            <div class="visualizacao-cabecalho">
                <span id="visualizacao-status">Preparando a árvore...</span>
                <span id="visualizacao-contador"></span>
            </div>
            <p class="tipo-arvore">Árvore binária · salva em pós-ordem para preservar a frase</p>
            <p id="mensagem-original"></p>
            <div id="letras-embaralhadas"></div>
            <div id="arvore"></div>
            <p id="ordem-posordem"></p>
        </section>

        <br><br>

        <button id="enviar">
            ENVIAR MENSAGEM
        </button>

        <br><br>

        
        <a href="/tela_principal/principal.html">
            <button>
                VOLTAR
            </button>
        </a>

    </container>

    <script src="/envio_mensagens/code.js"></script>

</body>
</html>
