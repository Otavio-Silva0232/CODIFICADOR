<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Decodificar Mensagem - Criptograte</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>
    <conteiner id="decodificar-container">
        <h1>DECODIFICAR MENSAGEM</h1>

        <p id="usuario"></p>

        <p>
            SELECIONE O ARQUIVO DE TEXTO CODIFICADO:
        </p>

        <input
            type="file"
            id="arquivo"
            accept=".txt"
        >

        <button id="decodificar">
            DECODIFICAR MENSAGEM
        </button>

        <a href="/tela_principal/principal.html">
            <button>
                VOLTAR
            </button>
        </a>
    </conteiner>
    
    <conteiner id="resultado-container">
        <div id="resultado"></div>
    </conteiner>

    <script src="/decodificar/code.js"></script>

</body>

</html>
