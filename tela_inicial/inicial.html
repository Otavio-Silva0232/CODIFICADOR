<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>BEM VINDO AO CRYPTOGRAPHY</h1>
    <p>Seja bem-vindo ao nosso sistema de criptografia de mensagens!</p>

    <container id = "Login">
        <h2>LOGIN</h2>
        <form id="loginform">
            <label for="username">Nome de usuário:</label>
            <input type="text" id="usuario" name="username" required><br><br>

            <label for="password">Senha:</label>
            <input type="password" id="senha" name="password" required><br><br>

            <button type="submit">Entrar</button>
        </form>

    </container>

    <div id="mensagem"></div>

    <script src="/tela_inicial/code.js"></script>
</body>
</html>
